# Explicit disposable/local HTTP override; never use for production auth evidence.
services:
  app:
    environment:
      NODE_ENV: development
      CLIENT_ORIGIN: http://localhost:${LOCAL_HTTP_PORT:-3000}
      TRUST_PROXY: 'false'
    ports:
      - 127.0.0.1:${LOCAL_HTTP_PORT:-3000}:3000
networks:
  edge:
    # Docker suppresses port publication when every attached network is internal.
    internal: false
